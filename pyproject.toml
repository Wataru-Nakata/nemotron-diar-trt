[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemotron-diar-trt"
version = "0.1.0"
description = "Fast streaming Sortformer diarization (nvidia/Nemotron-3-Diarization) with TensorRT, without NeMo"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    # torch 2.10 or newer for the ONNX export (2.6 exports SplitToSequence, which TensorRT cannot parse)
    "torch>=2.10",
    # the default backend; imported lazily, so backend="torch" also works where TensorRT is missing
    "tensorrt>=10.16",
    "numpy",
    "huggingface-hub",
    "pyyaml",
    "soundfile",
    "onnx",
    "onnxscript",
]

[project.scripts]
nemotron-diar-trt = "nemotron_diar_trt.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/nemotron_diar_trt"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
